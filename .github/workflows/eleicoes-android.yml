name: Central Eleições 2026 — APKs

on:
  workflow_dispatch:
  push:
    paths:
      - 'eleicoes-2026/**'
      - '!eleicoes-2026/probe/**'
      - '.github/workflows/eleicoes-android.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eleicoes-2026/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Montar HTML final (partes) e gerar MapData.java do app nativo
        working-directory: eleicoes-2026
        run: |
          cat html/part-*.html > central-eleicoes-2026.html
          python3 android/gen_mapdata.py central-eleicoes-2026.html android/native-app/src/main/java/br/com/centraleleicoes/nativeapp/MapData.java
          wc -c central-eleicoes-2026.html
      - name: Build APKs (WebView + Nativo) — Gradle/AGP oficial, assinados com a chave fixa do projeto
        run: gradle --no-daemon assembleRelease assembleDebug
      - name: Verificar assinatura com apksigner (e que é a chave fixa do projeto)
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          EXPECTED="fdbff9e989017b9523315b4037813467d59d6b9b93d31957815827a40b9ceaaa"
          for apk in webview-app/build/outputs/apk/release/*.apk native-app/build/outputs/apk/release/*.apk native-app/build/outputs/apk/debug/*.apk webview-app/build/outputs/apk/debug/*.apk; do
            echo "== $apk"
            "$APKSIGNER" verify --verbose --print-certs "$apk" | tee /tmp/sig.txt | head -6
            grep -qi "SHA-256 digest: $EXPECTED" /tmp/sig.txt || { echo "ASSINATURA DIFERENTE DA CHAVE FIXA"; exit 1; }
          done
      - name: Conferir que o HTML final está empacotado no APK WebView
        run: unzip -l webview-app/build/outputs/apk/release/webview-app-release.apk | grep -q 'assets/index.html'
      - name: Renomear
        run: |
          mkdir -p ../dist
          cp webview-app/build/outputs/apk/release/webview-app-release.apk ../dist/CentralEleicoes2026-WebView.apk
          cp native-app/build/outputs/apk/release/native-app-release.apk ../dist/CentralEleicoes2026-Nativo.apk
          cp webview-app/build/outputs/apk/debug/webview-app-debug.apk ../dist/test-WebView-debug.apk
          cp native-app/build/outputs/apk/debug/native-app-debug.apk ../dist/test-Nativo-debug.apk
          cp ../central-eleicoes-2026.html ../dist/
          ls -la ../dist
      - uses: actions/upload-artifact@v4
        with:
          name: central-eleicoes-2026
          path: eleicoes-2026/dist/*
      - name: Publicar APKs na branch apk-dist (download direto)
        run: |
          cd "$GITHUB_WORKSPACE"
          rm -rf /tmp/apkdist && mkdir /tmp/apkdist && cp eleicoes-2026/dist/CentralEleicoes2026-*.apk eleicoes-2026/dist/central-eleicoes-2026.html /tmp/apkdist/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan apk-dist
          git rm -rf --quiet .
          git clean -fdxq
          cp /tmp/apkdist/* .
          git add -A
          git commit -q -m "APKs do build ${GITHUB_SHA::7}"
          git push -f origin apk-dist

  smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: central-eleicoes-2026
          path: dist
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          script: bash eleicoes-2026/smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screenshots
          path: dist/*.png
      - name: Publicar prints na branch smoke-shots
        if: always()
        run: |
          mkdir -p /tmp/shots && cp dist/*.png /tmp/shots/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan smoke-shots
          git rm -rf --quiet .
          git clean -fdxq
          cp /tmp/shots/* . 2>/dev/null || true
          git add -A
          git commit -q -m "prints do emulador ${GITHUB_SHA::7}" || exit 0
          git push -f origin smoke-shots

  release:
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: central-eleicoes-2026
          path: dist
      - name: Publicar/atualizar a release app-latest (link fixo de download)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          cp dist/CentralEleicoes2026-Nativo.apk dist/CentralEleicoes2026.apk
          printf '%s\n' \
            "versionCode=${{ github.run_number }}" \
            "" \
            "App Android **Eleições 2026** (versão nativa), compilado automaticamente e testado em emulador Android 15." \
            "" \
            "**Instalar:** baixe \`CentralEleicoes2026.apk\`, abra o arquivo e, se o Android pedir, permita instalar de fontes desconhecidas." \
            "" \
            "\`CentralEleicoes2026-WebView.apk\` é a versão WebView (idêntica ao site; atualiza o conteúdo sozinha pela internet)." \
            "" \
            "Atualizações: o app avisa e atualiza com um toque. Todos os builds usam a mesma chave de assinatura, então instalam por cima." \
            "" \
            "Dados oficiais do TSE; sem projeção. Build ${{ github.run_number }} • commit ${GITHUB_SHA::7}." > notes.md
          if gh release view app-latest --repo "$REPO" > /dev/null 2>&1; then
            gh release edit app-latest --repo "$REPO" --notes-file notes.md --latest
          else
            gh release create app-latest --repo "$REPO" --target "$GITHUB_SHA" --title "Eleições 2026 — app Android" --notes-file notes.md --latest
          fi
          gh release upload app-latest dist/CentralEleicoes2026.apk dist/CentralEleicoes2026-WebView.apk dist/central-eleicoes-2026.html --repo "$REPO" --clobber
