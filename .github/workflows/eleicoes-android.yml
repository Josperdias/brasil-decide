name: Central Eleições 2026 — APKs

on:
  workflow_dispatch:
  push:
    paths:
      - 'eleicoes-2026/**'
      - '.github/workflows/eleicoes-android.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eleicoes-2026/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Montar HTML final (partes) e gerar MapData.java do app nativo
        working-directory: eleicoes-2026
        run: |
          cat html/part-*.html > central-eleicoes-2026.html
          python3 android/gen_mapdata.py central-eleicoes-2026.html android/native-app/src/main/java/br/com/centraleleicoes/nativeapp/MapData.java
          wc -c central-eleicoes-2026.html
      - name: Build APKs (WebView + Nativo) — Gradle/AGP oficial, debug assinado pelo Gradle
        run: gradle --no-daemon assembleDebug
      - name: Verificar assinatura com apksigner
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          for apk in webview-app/build/outputs/apk/debug/*.apk native-app/build/outputs/apk/debug/*.apk; do
            echo "== $apk"; "$APKSIGNER" verify --verbose --print-certs "$apk" | head -8
          done
      - name: Conferir que o HTML final está empacotado no APK WebView
        run: unzip -l webview-app/build/outputs/apk/debug/webview-app-debug.apk | grep -q 'assets/index.html'
      - name: Renomear
        run: |
          mkdir -p ../dist
          cp webview-app/build/outputs/apk/debug/webview-app-debug.apk ../dist/CentralEleicoes2026-WebView.apk
          cp native-app/build/outputs/apk/debug/native-app-debug.apk ../dist/CentralEleicoes2026-Nativo.apk
          cp ../central-eleicoes-2026.html ../dist/
          ls -la ../dist
      - uses: actions/upload-artifact@v4
        with:
          name: central-eleicoes-2026
          path: eleicoes-2026/dist/*
      - name: Publicar APKs na branch apk-dist (download direto)
        run: |
          cd "$GITHUB_WORKSPACE"
          rm -rf /tmp/apkdist && mkdir /tmp/apkdist && cp eleicoes-2026/dist/* /tmp/apkdist/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan apk-dist
          git rm -rf --quiet .
          git clean -fdxq
          cp /tmp/apkdist/* .
          git add -A
          git commit -q -m "APKs do build ${GITHUB_SHA::7}"
          git push -f origin apk-dist

  smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: central-eleicoes-2026
          path: dist
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          script: |
            set -e
            adb install -r dist/CentralEleicoes2026-WebView.apk
            adb install -r dist/CentralEleicoes2026-Nativo.apk
            for pkg in br.com.centraleleicoes.webview br.com.centraleleicoes.nativeapp; do
              adb shell monkey -p $pkg -c android.intent.category.LAUNCHER 1
              sleep 20
              adb shell pidof $pkg
              adb exec-out screencap -p > dist/shot-$pkg.png
              adb logcat -d -s AndroidRuntime:E | head -30
            done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screenshots
          path: dist/*.png
