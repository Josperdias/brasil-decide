plugins {
    id 'com.android.application'
}

android {
    namespace 'br.com.centraleleicoes.webview'
    compileSdk 35

    defaultConfig {
        applicationId 'br.com.centraleleicoes.webview'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '2026.10.05'
    }

    buildTypes {
        release {
            minifyEnabled false
            // sem keystore configurado: use assembleDebug (assinado automaticamente pelo Gradle)
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        abortOnError false
    }
}

// Empacota o HTML final (../../central-eleicoes-2026.html) como assets/index.html
def htmlSrc = file('../../central-eleicoes-2026.html')
def genAssets = layout.buildDirectory.dir('generated/htmlAssets')
tasks.register('copyHtml', Copy) {
    from(htmlSrc) { rename { 'index.html' } }
    into genAssets
}
android.sourceSets.main.assets.srcDir(genAssets)
tasks.matching { it.name == 'preBuild' }.configureEach { dependsOn 'copyHtml' }
