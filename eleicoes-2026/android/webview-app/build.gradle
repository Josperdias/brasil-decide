plugins {
    id 'com.android.application'
}

android {
    namespace 'br.com.centraleleicoes.webview'
    compileSdk 35

    defaultConfig {
        applicationId 'br.com.centraleleicoes.webview'
        minSdk 26
        targetSdk 35
        // versionCode vem do número do build no CI (sobe a cada release); o app compara com a release publicada
        versionCode Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
        versionName "1.${System.getenv('GITHUB_RUN_NUMBER') ?: '0'}"
    }

    // Chave FIXA (keystore/central-eleicoes.jks): todo build é assinado igual, então o Android aceita
    // instalar a nova versão por cima da antiga (e o app pode se atualizar sozinho). Chave pública do projeto.
    signingConfigs {
        app {
            storeFile file('../keystore/central-eleicoes.jks')
            storeType 'pkcs12'
            storePassword 'central2026'
            keyAlias 'central'
            keyPassword 'central2026'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.app
        }
        debug {
            signingConfig signingConfigs.app
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        abortOnError false
    }
}

// Empacota o HTML final (../../central-eleicoes-2026.html) como assets/index.html
def htmlSrc = file('../../central-eleicoes-2026.html')
def genAssets = layout.buildDirectory.dir('generated/htmlAssets')
tasks.register('copyHtml', Copy) {
    from(htmlSrc) { rename { 'index.html' } }
    into genAssets
}
android.sourceSets.main.assets.srcDir(genAssets)
tasks.matching { it.name == 'preBuild' }.configureEach { dependsOn 'copyHtml' }
