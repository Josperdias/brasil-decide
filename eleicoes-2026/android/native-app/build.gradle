plugins {
    id 'com.android.application'
}

android {
    namespace 'br.com.centraleleicoes.nativeapp'
    compileSdk 35

    defaultConfig {
        applicationId 'br.com.centraleleicoes.nativeapp'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '2026.10.05'
    }

    buildTypes {
        release {
            minifyEnabled false
            // sem keystore configurado: use assembleDebug (assinado automaticamente pelo Gradle)
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        abortOnError false
    }
}
