plugins {
    id 'com.android.application'
}

android {
    namespace 'br.com.centraleleicoes.nativeapp'
    compileSdk 35

    defaultConfig {
        applicationId 'br.com.centraleleicoes.nativeapp'
        minSdk 26
        targetSdk 35
        // versionCode vem do número do build no CI (sobe a cada release); o app compara com a release publicada
        versionCode Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
        versionName "1.${System.getenv('GITHUB_RUN_NUMBER') ?: '0'}"
    }

    buildTypes {
        release {
            minifyEnabled false
            // sem keystore configurado: use assembleDebug (assinado automaticamente pelo Gradle)
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        abortOnError false
    }
}
